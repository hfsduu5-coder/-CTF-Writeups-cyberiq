name: Validate CTF Knowledge Base

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate progress generator
        run: |
          python scripts/update_progress.py
          git diff --exit-code data/progress.json
      - name: Validate portfolio files
        run: test -f site/index.html && test -f site/style.css && test -f dashboard/index.html
      - name: Validate JSON
        run: python -m json.tool data/progress.json >/dev/null
