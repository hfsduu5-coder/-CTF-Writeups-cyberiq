<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060709"><title>CyberIQ Practice Lab // 120 Challenges</title><link rel="stylesheet" href="../site/style.css"></head><body><nav><div class="wrap"><a class="brand" href="../"><img src="../assets/IMG_20261003_025605_506.PNG" alt="CyberIQ"> CyberIQ</a><div class="navlinks"><a href="../">Portfolio</a><a href="../dashboard/">Dashboard</a></div></div></nav><div class="scanlines"></div><main class="wrap"><header class="case-hero"><div class="eyebrow">CYBERIQ // PRACTICE LAB</div><h1>120 <span>Reference-Solved</span> Challenges</h1><p class="lead">A generated educational challenge bank for deliberate practice. These entries are reference labs, not claims of personal completion of third-party CTFs.</p><div class="case-meta"><span>30 CRYPTO</span><span>30 OSINT</span><span>20 WEB</span><span>15 FORENSICS</span><span>10 REVERSE</span><span>15 MISC</span></div></header><section><div class="archive-controls"><input id="q" type="search" placeholder="Search 120 practice labs…"><div class="filters" id="filters"></div></div><div id="count" class="section-sub"></div><div id="labs" class="lab-grid"></div></section></main><script>fetch("../data/practice-challenges.json").then(r=>r.json()).then(d=>{const labs=document.querySelector("#labs"),q=document.querySelector("#q"),fs=document.querySelector("#filters"),count=document.querySelector("#count");let cat="All";const cats=["All",...new Set(d.challenges.map(x=>x.category))];fs.innerHTML=cats.map((x,i)=>'<button class="'+(i?"":"active")+'" data-c="'+x+'">'+x+'</button>').join("");function draw(){let s=q.value.toLowerCase(),a=d.challenges.filter(x=>(cat==="All"||x.category===cat)&&JSON.stringify(x).toLowerCase().includes(s));count.textContent=a.length+" / "+d.count+" labs shown";labs.innerHTML=a.map(x=>'<details class="lab"><summary><span class="lab-id">#'+x.id+'</span><div><b>'+x.title+'</b><small>'+x.category+' • '+x.difficulty+'</small></div><em>'+x.status+'</em></summary><div class="lab-body"><h4>Scenario</h4><p>'+x.scenario+'</p><h4>Reference solution</h4><p>'+x.solution+'</p><h4>Defensive / learning takeaway</h4><p>'+x.lesson+'</p><div class="lab-note">'+x.provenance+' • Not a third-party completion claim</div></div></details>').join("")}q.oninput=draw;fs.onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;[...fs.children].forEach(b=>b.classList.toggle("active",b===e.target));draw()}};draw()})</script></body></html>
